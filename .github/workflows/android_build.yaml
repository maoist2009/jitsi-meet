name: Jitsi Meet Android Debug Build

on:
  push:
    branches: [ "feat/android-virtual-output-device-support" ]
  pull_request:
    branches: [ "feat/android-virtual-output-device-support" ]
  workflow_dispatch:

jobs:
  android-debug-build:
    name: Build Android Debug
    runs-on: ubuntu-latest
    env:
      # 使用Jitsi Meet官方推荐的版本
      ANDROID_COMPILE_SDK_VERSION: 34
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: 25.1.8937393
      ANDROID_CMAKE_VERSION: 3.22.1
      NODE_VERSION: 18.x
      JDK_VERSION: 17
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: vishal2005025/jitsi-meet
        ref: feat/android-virtual-output-device-support
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-versions: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
        ndk-versions: ${{ env.ANDROID_NDK_VERSION }}
        cmake-versions: ${{ env.ANDROID_CMAKE_VERSION }}
        build-tools-versions: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Ninja Build System
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
    
    - name: Install project dependencies
      run: |
        npm install -g yarn
        npm install --prefer-offline --no-audit
    
    - name: Build Android debug APK
      working-directory: android
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace --info
      env:
        ORG_GRADLE_PROJECT_newArchEnabled: 'false'
    
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jitsi-meet-android-debug-${{ github.sha }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Display build summary
      run: |
        echo "✅ Android debug build completed successfully!"
        echo "📱 APK location: android/app/build/outputs/apk/debug/app-debug.apk"
        echo "📦 Artifact name: jitsi-meet-android-debug-${{ github.sha }}"
