name: Android Release Build

on:
  push:
    branches: [ "feat/android-virtual-output-device-support" ]
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK_VERSION: 34
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: 25.1.8937393
      NODE_VERSION: 18.x
      JDK_VERSION: 17
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: vishal2005025/jitsi-meet
        ref: feat/android-virtual-output-device-support
        submodules: recursive
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-versions: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
        ndk-versions: ${{ env.ANDROID_NDK_VERSION }}
        build-tools-versions: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install
    
    - name: Verify Android debug keystore location
      run: |
        echo "Checking standard Android debug keystore locations..."
        ls -la ~/.android/debug.keystore || echo "~/.android/debug.keystore not found"
        ls -la android/app/debug.keystore || echo "android/app/debug.keystore not found"
        ls -la android/debug.keystore || echo "android/debug.keystore not found"
    
    - name: Build Android release bundle first
      run: |
        npx react-native bundle --platform android --dev false --entry-file index.js \
          --bundle-output android/app/src/main/assets/index.android.bundle \
          --assets-dest android/app/src/main/res
      working-directory: .
    
    - name: Build Android release APK with standard debug signing
      working-directory: android
      run: |
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace --info -Pandroid.injected.build.signature.debug.keystore=~/.android/debug.keystore
      env:
        ORG_GRADLE_PROJECT_newArchEnabled: 'false'
        # Standard Android debug keystore credentials
        ANDROID_DEBUG_KEYSTORE: "$HOME/.android/debug.keystore"
        ANDROID_DEBUG_KEYSTORE_PASSWORD: "android"
        ANDROID_DEBUG_KEY_ALIAS: "androiddebugkey"
        ANDROID_DEBUG_KEY_PASSWORD: "android"
    
    - name: Find and verify release APK
      id: find-apk
      run: |
        echo "Searching for release APK..."
        APK_PATH=$(find android -name "app-release*.apk" -print -quit)
        if [ -z "$APK_PATH" ]; then
          echo "❌ No release APK found!"
          find android -name "*.apk" -ls
          exit 1
        fi
        echo "✅ Found APK at: $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        ls -la "$APK_PATH"
    
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jitsi-meet-android-release-${{ github.sha }}
        path: ${{ steps.find-apk.outputs.apk_path }}
        retention-days: 30
    
    - name: Display build summary
      run: |
        echo "🎉 Android release build completed successfully!"
        echo "📱 APK location: ${{ steps.find-apk.outputs.apk_path }}"
        echo "📦 Artifact: jitsi-meet-android-release-${{ github.sha }}"
        echo "✅ This is a TRUE release build with:"
        echo "   - JS bundle packaged inside APK"
        echo "   - No development server dependency"
        echo "   - Optimized JavaScript code"
        echo "   - Can be used offline"
        echo "⚠️  Note: Uses standard debug signing for testing only"
