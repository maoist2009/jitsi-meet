name: Jitsi Meet Android Release Build

on:
  push:
    branches: [ "feat/android-virtual-output-device-support" ]
  workflow_dispatch:

jobs:
  android-release-build:
    name: Build Android Release
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK_VERSION: 34
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: 25.1.8937393
      NODE_VERSION: 18.x
      JDK_VERSION: 17
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: vishal2005025/jitsi-meet
        ref: feat/android-virtual-output-device-support
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-versions: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
        ndk-versions: ${{ env.ANDROID_NDK_VERSION }}
        build-tools-versions: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install project dependencies
      run: |
        npm install
    
    - name: Build Android release APK
      working-directory: android
      run: |
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace --info
      env:
        ORG_GRADLE_PROJECT_newArchEnabled: 'false'
        ORG_GRADLE_PROJECT_reactNativeReleaseEntryFile: 'react/index.native.js'
    
    - name: Find and upload ANY release APK
      run: |
        echo "🔍 Searching for ANY release APK..."
        APK_PATH=$(find android -name "app-release*.apk" -print -quit)
        
        if [ -z "$APK_PATH" ]; then
          echo "❌ No release APK found!"
          find android -name "*.apk" -ls
          exit 1
        fi
        
        echo "✅ Found APK: $APK_PATH"
        ls -la "$APK_PATH"
        
        # Copy to standard location for artifact upload
        mkdir -p ./release-artifact
        cp "$APK_PATH" ./release-artifact/app-release.apk
        echo "📦 Prepared artifact at: ./release-artifact/app-release.apk"
    
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jitsi-meet-android-release-${{ github.sha }}
        path: ./release-artifact/app-release.apk
        retention-days: 30
    
    - name: Display build summary
      run: |
        echo "🎉 Android release build completed successfully!"
        echo "📱 APK location: $(ls -la ./release-artifact/app-release.apk)"
        echo "📦 Artifact name: jitsi-meet-android-release-${{ github.sha }}"
        echo "✅ This is a TRUE release build with JS bundle packaged inside"
        echo "⚠️  Note: Uses debug signing for testing only"
