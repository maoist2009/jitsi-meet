name: Jitsi Meet Android Release Build

on:
  push:
    branches: [ "feat/android-virtual-output-device-support" ]
  workflow_dispatch:

jobs:
  android-release-build:
    name: Build Android Release
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK_VERSION: 34
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: 25.1.8937393
      NODE_VERSION: 18.x
      JDK_VERSION: 17
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: vishal2005025/jitsi-meet
        ref: feat/android-virtual-output-device-support
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-versions: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
        ndk-versions: ${{ env.ANDROID_NDK_VERSION }}
        build-tools-versions: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install project dependencies
      run: |
        npm install
    
    - name: Configure release signing with debug keystore
      run: |
        # Create signing config if it doesn't exist
        mkdir -p android/app
        # Standard Android debug keystore configuration
        echo "RELEASE_STORE_FILE=~/.android/debug.keystore" >> android/gradle.properties
        echo "RELEASE_STORE_PASSWORD=android" >> android/gradle.properties
        echo "RELEASE_KEY_ALIAS=androiddebugkey" >> android/gradle.properties
        echo "RELEASE_KEY_PASSWORD=android" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096M" >> android/gradle.properties
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
    
    - name: Build Android release APK
      working-directory: android
      run: |
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace --info
      env:
        ORG_GRADLE_PROJECT_newArchEnabled: 'false'
        # Set correct entry file paths for Gradle
        ORG_GRADLE_PROJECT_reactNativeDebugEntryFile: 'react/index.native.js'
        ORG_GRADLE_PROJECT_reactNativeReleaseEntryFile: 'react/index.native.js'
    
    - name: Verify release APK exists
      run: |
        echo "Checking for release APK..."
        find android -name "app-release*.apk" -ls
        if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
          echo "❌ Release APK not found at expected location!"
          exit 1
        fi
        echo "✅ Release APK built successfully!"
        ls -la android/app/build/outputs/apk/release/app-release.apk
    
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jitsi-meet-android-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
    
    - name: Display build summary
      run: |
        echo "🎉 Android release build completed successfully!"
        echo "📱 APK location: android/app/build/outputs/apk/release/app-release.apk"
        echo "📦 Artifact name: jitsi-meet-android-release-${{ github.sha }}"
        echo "✅ This is a TRUE release build with:"
        echo "   - JS bundle packaged inside APK"
        echo "   - No development server dependency"
        echo "   - Optimized JavaScript code"
        echo "   - Can be used offline"
        echo "⚠️  Note: Uses standard debug signing for testing only"
        echo "   DO NOT publish to Google Play Store with this signing configuration"
