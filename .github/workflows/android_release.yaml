name: Android Release Build

on:
  push:
    branches: [ "feat/android-virtual-output-device-support" ]
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK_VERSION: 34
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: 25.1.8937393
      ANDROID_CMAKE_VERSION: 3.22.1
      NODE_VERSION: 18.x
      JDK_VERSION: 17
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: vishal2005025/jitsi-meet
        ref: feat/android-virtual-output-device-support
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-versions: ${{ env.ANDROID_COMPILE_SDK_VERSION }}
        ndk-versions: ${{ env.ANDROID_NDK_VERSION }}
        cmake-versions: ${{ env.ANDROID_CMAKE_VERSION }}
        build-tools-versions: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Ninja Build System
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
    
    - name: Install project dependencies
      run: |
        npm install -g yarn
        npm install --prefer-offline --no-audit
    
    - name: Use debug signing config for release build
      run: |
        echo "Forcing debug signing config for release build..."
        cat > android/gradle.properties << EOL
        org.gradle.jvmargs=-Xmx4096M
        android.useAndroidX=true
        android.enableJetifier=true
        # Use debug signing config for release
        android.injected.build.signature.debug.keystore=debug.keystore
        android.injected.build.signature.debug.keystore.path=android/app/debug.keystore
        android.injected.build.signature.debug.keystore.password=android
        android.injected.build.signature.debug.key.alias=androiddebugkey
        android.injected.build.signature.debug.key.password=android
        EOL
    
    - name: Patch android/app/build.gradle to use debug signing
      run: |
        # Backup original file
        cp android/app/build.gradle android/app/build.gradle.backup
        
        # Create new build.gradle with debug signing config for release
        cat > android/app/build.gradle << EOL
        $(grep -v 'signingConfigs' android/app/build.gradle.backup | grep -v 'buildTypes')
        
        android {
            signingConfigs {
                debug {
                    storeFile file('debug.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
                release {
                    storeFile file('debug.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled enableProguardInReleaseBuilds
                    proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                }
            }
        }
        EOL
    
    - name: Build Android release APK
      working-directory: android
      run: |
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace --info
      env:
        ORG_GRADLE_PROJECT_newArchEnabled: 'false'
    
    - name: Verify release APK exists
      run: |
        ls -la android/app/build/outputs/apk/release/
        if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
          echo "❌ Release APK not found!"
          exit 1
        fi
        echo "✅ Release APK built successfully!"
    
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jitsi-meet-android-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
    
    - name: Display build summary
      run: |
        echo "🎉 Android release build completed successfully!"
        echo "📱 APK location: android/app/build/outputs/apk/release/app-release.apk"
        echo "📦 Artifact name: jitsi-meet-android-release-${{ github.sha }}"
        echo "⚠️  WARNING: This APK uses debug signing and is for testing/internal use only."
        echo "   DO NOT publish to Google Play Store with this signing configuration."
